# Sources aggregated into the signed apk feed served at
# https://openwrt-iac.github.io/feed/packages/all/uapi/
#
# Each entry names a GitHub repo + a glob matching the APK asset on its
# latest stable GitHub Release. `extra_tags` (space-separated) also serves
# the asset of each listed stable release. `gh release list --exclude-pre-releases`
# filters RC/alpha/beta/pre tags at the source; this feed is stable-only
# by construction.
#
# Add a new package: append a `- repo:`/`asset_pattern:` block.

sources:
  - repo: openwrt-iac/uapi
    asset_pattern: 'uapi-*.apk'
    # uapi 4.x needs a netifd that OpenWrt 25.12 does not ship. A 25.12 router installs 3.5.0
    # with `apk add 'uapi<4'`: apk-tools 3.0.5 does not fall back to it on its own.
    extra_tags: v3.5.0
  - repo: openwrt-iac/unbound-uci-ext
    asset_pattern: 'unbound-uci-ext-*.apk'
  - repo: openwrt-iac/apply-confirm
    asset_pattern: 'apply-confirm-*.apk'
  - repo: openwrt-iac/luci-app-uapi
    asset_pattern: 'luci-app-uapi-*.apk'
